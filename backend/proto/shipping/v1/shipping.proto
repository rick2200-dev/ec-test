syntax = "proto3";

package shipping.v1;

option go_package = "github.com/Riku-KANO/ec-test/gen/go/shipping/v1;shippingv1";

import "google/protobuf/timestamp.proto";

// ShippingService manages shipments for orders.
//
// NOTE: All RPCs below are currently unimplemented (codes.Unimplemented) on the
// server. The primary call path for v1 is HTTP proxied through the gateway.
// gRPC will be enabled once a gRPC auth interceptor is in place so that
// caller identity can be propagated securely in metadata.
service ShippingService {
  // GetShipmentByOrder retrieves the shipment for a given order.
  rpc GetShipmentByOrder(GetShipmentByOrderRequest) returns (GetShipmentByOrderResponse);

  // RegisterShipment marks a shipment as shipped and records the tracking number.
  rpc RegisterShipment(RegisterShipmentRequest) returns (RegisterShipmentResponse);

  // MarkDelivered marks a shipment as delivered.
  rpc MarkDelivered(MarkDeliveredRequest) returns (MarkDeliveredResponse);
}

// Shipment represents a physical delivery associated with an order.
message Shipment {
  string id              = 1;
  string seller_id       = 2;
  string order_id        = 3;
  string buyer_auth0_id  = 4;
  string status          = 5;  // pending | ready_to_ship | shipped | delivered | cancelled
  string carrier         = 6;
  string tracking_number = 7;
  string note            = 8;
  string shipping_address_json = 9;
  google.protobuf.Timestamp shipped_at   = 10;
  google.protobuf.Timestamp delivered_at = 11;
  google.protobuf.Timestamp created_at   = 12;
  google.protobuf.Timestamp updated_at   = 13;
}

message GetShipmentByOrderRequest {
  string order_id  = 1;
}

message GetShipmentByOrderResponse {
  Shipment shipment = 1;
}

message RegisterShipmentRequest {
  string id              = 1;
  string seller_id       = 2;
  string carrier         = 3;
  string tracking_number = 4;
  string note            = 5;
  google.protobuf.Timestamp shipped_at = 6;
}

message RegisterShipmentResponse {
  Shipment shipment = 1;
}

message MarkDeliveredRequest {
  string id        = 1;
  string seller_id = 2;
  google.protobuf.Timestamp delivered_at = 3;
}

message MarkDeliveredResponse {
  Shipment shipment = 1;
}
