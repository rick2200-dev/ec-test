version: v2
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc-ecosystem/openapiv2
    out: openapi
    opt:
      - json_names_for_fields=false
      - use_go_templates=true
      - allow_merge=true
      - merge_file_name=subscription.v1
