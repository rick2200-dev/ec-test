name: Skill Validation

# Plain GitHub Actions workflow (NOT a gh-aw .md). VRT-style A/B compare of
# the skill SKILL.md between PR's base ref and head ref. Author writes test
# cases in `.claude/skills/<name>/gha-eval/case-N.md`; if absent, the
# orchestrator agent generates fallback cases from the current SKILL.md.
#
# All evaluation logic lives in .github/scripts/skill-eval/run_eval.py to
# keep this workflow short and reviewable.

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Pick a known skill (or '(custom)' + fill custom_skill_name)"
        required: true
        type: choice
        options:
          - architect-review
          - ec-backend-impl
          - gh-aw
          - grpc-integration
          - "(custom)"
      custom_skill_name:
        description: "Skill name (used when skill='(custom)')"
        required: false
        type: string
      pr_number:
        description: "PR number to post results to (optional)"
        required: false
        type: string
      ref:
        description: "Git ref / SHA to evaluate as HEAD (default: PR head or branch tip)"
        required: false
        type: string
      base_ref:
        description: "Git ref / SHA to compare against as BASE (default: PR base or default_branch)"
        required: false
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write          # `gh pr comment` posts via the issue-comments API

concurrency:
  group: skill-eval-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  skill-eval:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/skill-eval')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Copilot CLI model identifier — uses dots (NOT hyphens). `auto` lets
      # the CLI pick the account-default model. See call_copilot.sh comments
      # for advertised model strings and identifier-format rationale.
      MODEL: auto
      MAX_TOKENS_IMPL: "2048"
      MAX_TOKENS_JUDGE: "1024"
      MEAN_THRESHOLD: "1.5"
      # Copilot auth: PAT from a Copilot-licensed account (the default
      # github-actions[bot] GITHUB_TOKEN has no Copilot subscription).
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

    steps:
      # 1. Permission gate (slash-command path only). workflow_dispatch is
      # already gated by repo-level settings.
      - name: Permission gate
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          PERM=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" -q .permission 2>/dev/null || echo "none")
          case "$PERM" in
            admin|maintain|write) echo "actor=$ACTOR permission=$PERM (allowed)" ;;
            *)
              gh pr comment "$PR_NUMBER" \
                --body "⚠️ \`/skill-eval\` requires write access. Your permission: \`$PERM\`. Workflow will not run." \
                || true
              # Hard fail so subsequent steps (checkout / Copilot CLI) do NOT run.
              exit 1 ;;
          esac

      # 2. Resolve trusted inputs from event payload (NEVER from artifacts).
      # Sets outputs: skill_name, pr_number, ref, base_ref, skip.
      - name: Resolve inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_INPUT: ${{ github.event.inputs.pr_number }}
          PR_NUMBER_FROM_COMMENT: ${{ github.event.issue.number }}
          REF_INPUT: ${{ github.event.inputs.ref }}
          BASE_REF_INPUT: ${{ github.event.inputs.base_ref }}
          SKILL_INPUT: ${{ github.event.inputs.skill }}
          CUSTOM_SKILL_INPUT: ${{ github.event.inputs.custom_skill_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SKILL_NAME=$([ "$SKILL_INPUT" = "(custom)" ] && printf '%s' "$CUSTOM_SKILL_INPUT" || printf '%s' "$SKILL_INPUT")
            PR_NUMBER="$PR_NUMBER_INPUT"; REF="$REF_INPUT"; BASE_REF="$BASE_REF_INPUT"
          else
            PR_NUMBER="$PR_NUMBER_FROM_COMMENT"; REF=""; BASE_REF=""
            SKILL_NAME=$(printf '%s' "$COMMENT_BODY" | grep -oE '/skill-eval[[:space:]]+[^[:space:]]+' | head -1 | awk '{print $2}')
          fi

          # Validate skill name (also defends against path traversal)
          if [ -z "$SKILL_NAME" ] || ! printf '%s' "$SKILL_NAME" | grep -qE '^[a-zA-Z0-9._-]+$'; then
            [ -n "$PR_NUMBER" ] && gh pr comment "$PR_NUMBER" --body "Usage: \`/skill-eval <skill-name>\`. Skill name must match \`^[a-zA-Z0-9._-]+\$\`." || true
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$SKILL_NAME" in *..*|/*|*/*) echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;; esac

          # Validate PR number
          if [ -n "$PR_NUMBER" ] && ! printf '%s' "$PR_NUMBER" | grep -qE '^[0-9]+$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Resolve REF (HEAD) and BASE_REF
          [ -z "$REF" ] && [ -n "$PR_NUMBER" ] && REF=$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)
          [ -z "$REF" ] && REF=$(gh api "repos/$REPO" -q .default_branch)
          [ -z "$BASE_REF" ] && [ -n "$PR_NUMBER" ] && BASE_REF=$(gh pr view "$PR_NUMBER" --json baseRefOid -q .baseRefOid)
          [ -z "$BASE_REF" ] && BASE_REF=$(gh api "repos/$REPO" -q .default_branch)
          for v in "$REF" "$BASE_REF"; do
            if ! printf '%s' "$v" | grep -qE '^[0-9a-fA-F]{7,40}$|^[a-zA-Z0-9._/-]+$'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done

          {
            echo "skill_name=$SKILL_NAME"
            echo "pr_number=$PR_NUMBER"
            echo "ref=$REF"
            echo "base_ref=$BASE_REF"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      # 3. Fork-PR guard — fork code must NEVER reach the model with
      # COPILOT_GITHUB_TOKEN in scope. Hard-fail with exit 1.
      - name: Fork PR guard
        if: steps.inputs.outputs.skip != 'true' && steps.inputs.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.inputs.outputs.pr_number }}
        run: |
          set -euo pipefail
          IS_FORK=$(gh pr view "$PR_NUMBER" --json isCrossRepository -q .isCrossRepository)
          if [ "$IS_FORK" = "true" ]; then
            gh pr comment "$PR_NUMBER" --body "⚠️ Skill validation does not run on fork PRs. Rebase onto a base-repo branch or ask a maintainer." || true
            exit 1
          fi

      # 4. Checkout HEAD with full history (run_eval.py uses git show on BASE).
      - name: Checkout
        if: steps.inputs.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.inputs.outputs.ref }}
          fetch-depth: 0

      # 5. Setup runtimes + Copilot CLI + verify auth.
      - name: Setup runtimes and Copilot CLI
        if: steps.inputs.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ steps.inputs.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            MSG="⚠️ Skill validation cannot run: repository secret \`COPILOT_GITHUB_TOKEN\` is not set. \
            Create a fine-grained PAT from a Copilot-licensed account and store it as that secret. \
            See https://docs.github.com/en/copilot/how-tos/copilot-cli/automate-copilot-cli/run-cli-programmatically"
            [ -n "$PR_NUMBER" ] && gh pr comment "$PR_NUMBER" --body "$MSG" || true
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          chmod +x .github/scripts/skill-eval/call_copilot.sh

      - name: Setup Python
        if: steps.inputs.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        if: steps.inputs.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install GitHub Copilot CLI
        if: steps.inputs.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if ! command -v copilot >/dev/null 2>&1; then npm install -g @github/copilot; fi
          copilot --version || true

      # 6. Run the validation pipeline. All Python; YAML stays minimal.
      - name: Run skill validation
        if: steps.inputs.outputs.skip != 'true'
        id: run
        env:
          SKILL_NAME: ${{ steps.inputs.outputs.skill_name }}
          PR_NUMBER: ${{ steps.inputs.outputs.pr_number }}
          REF: ${{ steps.inputs.outputs.ref }}
          BASE_REF: ${{ steps.inputs.outputs.base_ref }}
        run: |
          set -euo pipefail
          WORKDIR="/tmp/skill-eval/${SKILL_NAME}"
          python3 .github/scripts/skill-eval/run_eval.py \
            --skill-name "$SKILL_NAME" \
            --head-ref "$REF" \
            --base-ref "$BASE_REF" \
            --pr-number "$PR_NUMBER" \
            --workdir "$WORKDIR" \
            --model "$MODEL" \
            --max-tokens-impl "$MAX_TOKENS_IMPL" \
            --max-tokens-judge "$MAX_TOKENS_JUDGE" \
            --mean-threshold "$MEAN_THRESHOLD"
          echo "workdir=$WORKDIR" >> "$GITHUB_OUTPUT"

      # 7. Post results: $GITHUB_STEP_SUMMARY + PR comment.
      - name: Post results
        if: steps.inputs.outputs.skip != 'true' && steps.run.outputs.workdir != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.inputs.outputs.pr_number }}
          WORKDIR: ${{ steps.run.outputs.workdir }}
        run: |
          set -euo pipefail
          if [ -f "$WORKDIR/summary.md" ]; then
            cat "$WORKDIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$PR_NUMBER" ]; then
              gh pr comment "$PR_NUMBER" --body-file "$WORKDIR/summary.md" || true
            fi
          fi

      # 8. Always upload artifact for diagnostics.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-eval-${{ github.run_id }}
          path: /tmp/skill-eval/**
          retention-days: 30
          if-no-files-found: ignore
