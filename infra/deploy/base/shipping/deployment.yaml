apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  labels:
    app.kubernetes.io/name: shipping
    app.kubernetes.io/component: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shipping
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipping
        app.kubernetes.io/component: service
    spec:
      serviceAccountName: shipping
      terminationGracePeriodSeconds: 30
      containers:
        - name: shipping
          image: shipping
          ports:
            - name: http
              containerPort: 8092
              protocol: TCP
            - name: grpc
              containerPort: 50059
              protocol: TCP
          envFrom:
            - secretRef:
                name: shipping-secrets
            - configMapRef:
                name: shipping-config
          env:
            - name: HTTP_PORT
              value: "8092"
            - name: GRPC_PORT
              value: "50059"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
