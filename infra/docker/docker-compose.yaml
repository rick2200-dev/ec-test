services:
  gateway:
    build:
      context: ../..
      dockerfile: backend/services/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
      LOG_LEVEL: debug
      LOG_FORMAT: text
      AUTH_SERVICE_URL: http://auth:8081
      CATALOG_SERVICE_URL: http://catalog:8082
      ORDER_SERVICE_URL: http://order:8083
      INVENTORY_SERVICE_URL: http://inventory:8084
      SEARCH_SERVICE_URL: http://search:8085
      RECOMMEND_SERVICE_URL: http://recommend:8086
      NOTIFICATION_SERVICE_URL: http://notification:8087
      CART_SERVICE_URL: http://cart:8088
      INQUIRY_SERVICE_URL: http://inquiry:8090
      REVIEW_SERVICE_URL: http://review:8091
      SUBSCRIPTION_SERVICE_URL: http://subscription:8089
      # Must match SUBSCRIPTION_INTERNAL_TOKEN on the subscription service.
      SUBSCRIPTION_INTERNAL_TOKEN: local-dev-subscription-internal-token
      SHIPPING_SERVICE_URL: http://shipping:8092
      # Must match SHIPPING_INTERNAL_TOKEN on the shipping service.
      SHIPPING_INTERNAL_TOKEN: local-dev-shipping-internal-token
      # DB 8 is the API-token rate limiter's namespace; cart owns DB 7.
      REDIS_URL: redis://redis:6379/8
      # Must match auth service API_TOKEN_PREFIX.
      API_TOKEN_PREFIX: sk_live_
      # Auth0 JWKS — required for buyer JWT verification. Leave the
      # variables undefined and the gateway starts without JWT auth.
      # Populate these in infra/docker/.env from your Auth0 tenant.
      JWKS_URL: ${JWKS_URL:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
    depends_on:
      auth:
        condition: service_healthy
      catalog:
        condition: service_healthy
      redis:
        condition: service_healthy
      subscription:
        condition: service_healthy
      shipping:
        condition: service_healthy
    networks:
      - backend

  auth:
    build:
      context: ../..
      dockerfile: backend/services/auth/Dockerfile
    ports:
      - "8081:8081"
    environment:
      HTTP_PORT: "8081"
      LOG_LEVEL: debug
      LOG_FORMAT: text
      DATABASE_URL: postgres://auth_role:localdev@postgres:5432/ecmarket_dev?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-dev-secret-do-not-use-in-production
      # Shared secret gating /internal/authz and /internal/buyers.
      # The Next.js BFF calls the upsert endpoint using this token.
      AUTH_INTERNAL_TOKEN: ${AUTH_INTERNAL_TOKEN:-dev-internal-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend

  catalog:
    build:
      context: ../..
      dockerfile: backend/services/catalog/Dockerfile
    ports:
      - "8082:8082"
    environment:
      HTTP_PORT: "8082"
      LOG_LEVEL: debug
      LOG_FORMAT: text
      DATABASE_URL: postgres://catalog_role:localdev@postgres:5432/ecmarket_dev?sslmode=disable
      REDIS_URL: redis://redis:6379/1
      PUBSUB_PROJECT_ID: local-project
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      # Must match cart.CATALOG_INTERNAL_TOKEN.
      CATALOG_INTERNAL_TOKEN: local-dev-catalog-internal-token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend

  order:
    build:
      context: ../..
      dockerfile: backend/services/order/Dockerfile
    ports:
      - "8083:8083"
    environment:
      HTTP_PORT: "8083"
      LOG_LEVEL: debug
      LOG_FORMAT: text
      DATABASE_URL: postgres://order_role:localdev@postgres:5432/ecmarket_dev?sslmode=disable
      REDIS_URL: redis://redis:6379/2
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      INVENTORY_SERVICE_URL: http://inventory:8084
      CATALOG_SERVICE_URL: http://catalog:8082
      NOTIFICATION_SERVICE_URL: http://notification:8087
      SUBSCRIPTION_SERVICE_GRPC_ADDR: subscription:50058
      # Must match SUBSCRIPTION_INTERNAL_TOKEN on the subscription service.
      SUBSCRIPTION_INTERNAL_TOKEN: local-dev-subscription-internal-token
      # Must match cart/inquiry ORDER_INTERNAL_TOKEN.
      ORDER_INTERNAL_TOKEN: local-dev-order-internal-token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inventory:
        condition: service_healthy
      subscription:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend

  inventory:
    build:
      context: ../..
      dockerfile: backend/services/inventory/Dockerfile
    ports:
      - "8084:8084"
    environment:
      HTTP_PORT: "8084"
      LOG_LEVEL: debug
      LOG_FORMAT: text
      DATABASE_URL: postgres://inventory_role:localdev@postgres:5432/ecmarket_dev?sslmode=disable
      REDIS_URL: redis://redis:6379/3
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend

  search:
    build:
      context: ../..
      dockerfile: backend/services/search/Dockerfile
    ports:
      - "8085:8085"
    environment:
      HTTP_PORT: "8085"
      LOG_LEVEL: debug
      LOG_FORMAT: text
      DATABASE_URL: postgres://search_role:localdev@postgres:5432/ecmarket_dev?sslmode=disable
      REDIS_URL: redis://redis:6379/4
      PUBSUB_PROJECT_ID: local-project
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      AUTH_SERVICE_URL: http://auth:8081
      # Must match AUTH_INTERNAL_TOKEN on the auth service.
      AUTH_INTERNAL_TOKEN: ${AUTH_INTERNAL_TOKEN:-dev-internal-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend

  recommend:
    build:
      context: ../..
      dockerfile: backend/services/recommend/Dockerfile
    ports:
      - "8086:8086"
    environment:
      HTTP_PORT: "8086"
      LOG_LEVEL: debug
      LOG_FORMAT: text
      DATABASE_URL: postgres://recommend_role:localdev@postgres:5432/ecmarket_dev?sslmode=disable
      REDIS_URL: redis://redis:6379/5
      CATALOG_SERVICE_URL: http://catalog:8082
      PUBSUB_PROJECT_ID: local-project
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend

  notification:
    build:
      context: ../..
      dockerfile: backend/services/notification/Dockerfile
    ports:
      - "8087:8087"
    environment:
      HTTP_PORT: "8087"
      LOG_LEVEL: debug
      LOG_FORMAT: text
      # Phase 3 pilot: notification runs against its own Postgres
      # instance (postgres-notification) so a shared-cluster outage does
      # not take its dedup inbox offline.
      DATABASE_URL: postgres://notification_role:localdev@postgres-notification:5432/notification_dev?sslmode=disable
      REDIS_URL: redis://redis:6379/6
      PUBSUB_PROJECT_ID: local-project
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
    depends_on:
      postgres-notification:
        condition: service_healthy
      redis:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend

  cart:
    build:
      context: ../..
      dockerfile: backend/services/cart/Dockerfile
    ports:
      - "8088:8088"
    environment:
      HTTP_PORT: "8088"
      LOG_LEVEL: debug
      LOG_FORMAT: text
      REDIS_URL: redis://redis:6379/7
      CATALOG_SERVICE_URL: http://catalog:8082
      ORDER_SERVICE_URL: http://order:8083
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      # Shared secrets for /internal calls; must match the respective
      # *_INTERNAL_TOKEN on the catalog and order services.
      CATALOG_INTERNAL_TOKEN: local-dev-catalog-internal-token
      ORDER_INTERNAL_TOKEN: local-dev-order-internal-token
    depends_on:
      redis:
        condition: service_healthy
      catalog:
        condition: service_healthy
      order:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend

  inquiry:
    build:
      context: ../..
      dockerfile: backend/services/inquiry/Dockerfile
    ports:
      - "8090:8090"
    environment:
      HTTP_PORT: "8090"
      LOG_LEVEL: debug
      LOG_FORMAT: text
      DATABASE_URL: postgres://inquiry_role:localdev@postgres:5432/ecmarket_dev?sslmode=disable
      ORDER_SERVICE_URL: http://order:8083
      AUTH_SERVICE_URL: http://auth:8081
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      # Must match order.ORDER_INTERNAL_TOKEN.
      ORDER_INTERNAL_TOKEN: local-dev-order-internal-token
    depends_on:
      postgres:
        condition: service_healthy
      order:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend

  subscription:
    build:
      context: ../..
      dockerfile: backend/services/subscription/Dockerfile
    # Intentionally not publishing host ports: the subscription service is
    # reached only by gateway (HTTP) and order (gRPC) over the backend
    # docker network. Exposing 8089/50058 to the host bypassed the
    # X-Internal-Token shared-secret gate and was the root cause of
    # Phase 2's auth-boundary regression.
    expose:
      - "8089"
      - "50058"
    environment:
      HTTP_PORT: "8089"
      GRPC_PORT: "50058"
      LOG_LEVEL: debug
      LOG_FORMAT: text
      DATABASE_URL: postgres://subscription_role:localdev@postgres:5432/ecmarket_dev?sslmode=disable
      # Must match SUBSCRIPTION_INTERNAL_TOKEN on gateway + order.
      SUBSCRIPTION_INTERNAL_TOKEN: local-dev-subscription-internal-token
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend

  shipping:
    build:
      context: ../..
      dockerfile: backend/services/shipping/Dockerfile
    # Not publishing host ports: shipping is reached only by gateway over the
    # backend docker network. Exposing 8092 to the host would bypass the
    # X-Internal-Token shared-secret gate.
    expose:
      - "8092"
      - "50059"
    environment:
      HTTP_PORT: "8092"
      GRPC_PORT: "50059"
      LOG_LEVEL: debug
      LOG_FORMAT: text
      DATABASE_URL: postgres://shipping_role:localdev@postgres:5432/ecmarket_dev?sslmode=disable
      PUBSUB_PROJECT_ID: local-project
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      # Must match SHIPPING_INTERNAL_TOKEN on the gateway.
      SHIPPING_INTERNAL_TOKEN: local-dev-shipping-internal-token
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend

  review:
    build:
      context: ../..
      dockerfile: backend/services/review/Dockerfile
    ports:
      - "8091:8091"
    environment:
      HTTP_PORT: "8091"
      LOG_LEVEL: debug
      LOG_FORMAT: text
      DATABASE_URL: postgres://review_role:localdev@postgres:5432/ecmarket_dev?sslmode=disable
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      CATALOG_SERVICE_URL: http://catalog:8082
      ORDER_SERVICE_URL: http://order:8083
      CATALOG_INTERNAL_TOKEN: local-dev-catalog-internal-token
      ORDER_INTERNAL_TOKEN: local-dev-order-internal-token
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_healthy
      order:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend

  postgres:
    extends:
      file: docker-compose.deps.yaml
      service: postgres
    networks:
      - backend

  redis:
    extends:
      file: docker-compose.deps.yaml
      service: redis
    networks:
      - backend

  pubsub-emulator:
    extends:
      file: docker-compose.deps.yaml
      service: pubsub-emulator
    networks:
      - backend

  postgres-notification:
    extends:
      file: docker-compose.deps.yaml
      service: postgres-notification
    networks:
      - backend

  # One-shot init container that seeds the emulator with every topic +
  # subscription the services expect. Publishers / subscribers fail with
  # NotFound unless the resource exists, and the emulator image itself
  # ships no provisioning hooks.
  pubsub-init:
    image: curlimages/curl:8.8.0
    depends_on:
      - pubsub-emulator
    environment:
      PUBSUB_PROJECT_ID: local-project
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
    volumes:
      - ../scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/pubsub_emulator_init.sh"]
    networks:
      - backend
    restart: "no"

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  pgdata-notification:
