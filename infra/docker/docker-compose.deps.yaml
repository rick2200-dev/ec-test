services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: ecmarket_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d ecmarket_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"

  # Phase 3 pilot: notification's DB is broken out of the shared cluster.
  # Host port differs from the shared instance so both run side by side
  # for local development.
  postgres-notification:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: notification_dev
    volumes:
      - pgdata-notification:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d notification_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Phase 3: subscription follows notification out of the shared cluster.
  # Port 5434 so it coexists with the shared (5432) and notification (5433)
  # instances in local dev.
  postgres-subscription:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: subscription_dev
    volumes:
      - pgdata-subscription:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d subscription_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Phase 3: shipping split. Port 5435 to coexist with the shared (5432),
  # notification (5433), and subscription (5434) instances.
  postgres-shipping:
    image: postgres:16-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: shipping_dev
    volumes:
      - pgdata-shipping:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d shipping_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Phase 3: auth split. Port 5437.
  postgres-auth:
    image: postgres:16-alpine
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: auth_dev
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d auth_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Phase 3: inquiry split. Port 5438.
  postgres-inquiry:
    image: postgres:16-alpine
    ports:
      - "5438:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: inquiry_dev
    volumes:
      - pgdata-inquiry:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d inquiry_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Phase 3: review split. Port 5439.
  postgres-review:
    image: postgres:16-alpine
    ports:
      - "5439:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: review_dev
    volumes:
      - pgdata-review:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d review_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Phase 3: inventory split. Port 5436.
  postgres-inventory:
    image: postgres:16-alpine
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: inventory_dev
    volumes:
      - pgdata-inventory:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d inventory_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Phase 3: order split. Port 5443.
  postgres-order:
    image: postgres:16-alpine
    ports:
      - "5443:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: order_dev
    volumes:
      - pgdata-order:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d order_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Phase 3: catalog split. Port 5442.
  postgres-catalog:
    image: postgres:16-alpine
    ports:
      - "5442:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: catalog_dev
    volumes:
      - pgdata-catalog:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d catalog_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Phase 3: search split. Port 5440.
  postgres-search:
    image: postgres:16-alpine
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: search_dev
    volumes:
      - pgdata-search:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d search_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Phase 3: recommend split. Port 5441.
  postgres-recommend:
    image: postgres:16-alpine
    ports:
      - "5441:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: recommend_dev
    volumes:
      - pgdata-recommend:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d recommend_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # coupon owns its own instance so a shared-cluster outage can't take
  # down discount redemption at checkout.
  postgres-coupon:
    image: postgres:16-alpine
    ports:
      - "5444:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: coupon_dev
    volumes:
      - pgdata-coupon:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d coupon_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # loyalty owns its own instance: the points ledger is append-only and
  # growth-dominant, so isolating its write volume keeps the shared
  # cluster healthy.
  postgres-loyalty:
    image: postgres:16-alpine
    ports:
      - "5445:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: loyalty_dev
    volumes:
      - pgdata-loyalty:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d loyalty_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  pgdata-notification:
  pgdata-subscription:
  pgdata-shipping:
  pgdata-auth:
  pgdata-inquiry:
  pgdata-review:
  pgdata-inventory:
  pgdata-search:
  pgdata-recommend:
  pgdata-order:
  pgdata-catalog:
  pgdata-coupon:
  pgdata-loyalty:
