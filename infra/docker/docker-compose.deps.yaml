services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: ecmarket_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d ecmarket_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"

  # Phase 3 pilot: notification's DB is broken out of the shared cluster.
  # Host port differs from the shared instance so both run side by side
  # for local development.
  postgres-notification:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: notification_dev
    volumes:
      - pgdata-notification:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d notification_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Phase 3: subscription follows notification out of the shared cluster.
  # Port 5434 so it coexists with the shared (5432) and notification (5433)
  # instances in local dev.
  postgres-subscription:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: subscription_dev
    volumes:
      - pgdata-subscription:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d subscription_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Phase 3: shipping split. Port 5435 to coexist with the shared (5432),
  # notification (5433), and subscription (5434) instances.
  postgres-shipping:
    image: postgres:16-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ecmarket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: shipping_dev
    volumes:
      - pgdata-shipping:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmarket -d shipping_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  pgdata-notification:
  pgdata-subscription:
  pgdata-shipping:
